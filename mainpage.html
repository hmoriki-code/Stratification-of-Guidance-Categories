<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特定保健指導 階層化判定ツール</title>
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            background-color: #f4f7f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 48px 56px;
            text-align: center;
        }
        h1 {
            color: #134f5c;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
        }
        a.btn {
            display: inline-block;
            background-color: #134f5c;
            color: #fff;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }
        a.btn:hover {
            background-color: #0e3d47;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>特定保健指導 階層化判定ツール</h1>
        <p>健診データを入力すると、自動で階層化判定が行われます。</p>
        <a href="subject_form.html" class="btn">対象者 新規登録へ</a>
    </div>
</body>
</html>
